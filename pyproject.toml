[project]
name = "shared-template"
version = "0.1.0"
description = "Development tooling for the shared application Copier template"
readme = "README.md"
authors = [
    { name = "XiantongC612", email = "xiantongc@knowwhy.tech" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "copier>=9.17.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ty.environment]
python-version = "3.14"
