---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 3
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 3
