---
name: Generated integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-project:
    name: ${{ matrix.case }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: react
            timeout: 30
          - case: astro
            timeout: 30
          - case: hono
            timeout: 30
          - case: fastapi
            timeout: 40
          - case: tauri
            timeout: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: matrix.case == 'tauri'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Set up Docker Buildx
        if: matrix.case == 'fastapi'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Install Devbox
        uses: jetify-com/devbox-install-action@22b0f5500b14df4ea357ce673fbd4ced940ed6a1 # v0.13.0
        with:
          enable-cache: true
          devbox-version: 0.17.5
          sha256-checksum: eb2d8fb34266ba3befc294d7d6f56e2cd4da2cacb7a0cf52db5b8092575544f8
          disable-nix-access-token: true
      - name: Validate generated project
        run: devbox run "integration:${{ matrix.case }}"
