---
name: Generated integration

on:
  pull_request:
    paths:
      - "copier.yml"
      - "template/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  push:
    branches:
      - main
    paths:
      - "copier.yml"
      - "template/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-project:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: react
            family: react
            timeout: 30
            e2e: false
          - case: react-integrations
            family: react
            timeout: 40
            e2e: true
          - case: astro
            family: astro
            timeout: 30
            e2e: false
          - case: astro-integrations
            family: astro
            timeout: 40
            e2e: true
          - case: hono
            family: hono
            timeout: 30
            e2e: false
          - case: hono-integrations
            family: hono
            timeout: 35
            e2e: false
          - case: fastapi
            family: fastapi
            timeout: 40
            e2e: false
          - case: fastapi-integrations
            family: fastapi
            timeout: 45
            e2e: false
          - case: scripts
            family: scripts
            timeout: 30
            e2e: false
          - case: scripts-integrations
            family: scripts
            timeout: 50
            e2e: false
          - case: tauri-all
            family: tauri
            timeout: 120
            e2e: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: matrix.family == 'tauri'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64
      - name: Set up Docker Buildx
        if: matrix.family == 'fastapi'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.17.5
          sha256-checksum: eb2d8fb34266ba3befc294d7d6f56e2cd4da2cacb7a0cf52db5b8092575544f8
          disable-nix-access-token: true
      - name: Cache Bun downloads
        if: matrix.family == 'react' || matrix.family == 'astro' || matrix.family == 'tauri' || matrix.family == 'hono'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: integration-${{ runner.os }}-bun-${{ matrix.case }}-${{ hashFiles('copier.yml', 'template/**') }}
          restore-keys: integration-${{ runner.os }}-bun-${{ matrix.case }}-
      - name: Cache Cargo downloads
        if: matrix.family == 'tauri'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: integration-${{ runner.os }}-cargo-${{ matrix.case }}-${{ hashFiles('template/**/Cargo.toml.jinja') }}
          restore-keys: integration-${{ runner.os }}-cargo-${{ matrix.case }}-
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: integration-${{ runner.os }}-uv-${{ matrix.case }}-${{ hashFiles('uv.lock', 'template/**') }}
          restore-keys: integration-${{ runner.os }}-uv-${{ matrix.case }}-
      - name: Cache Playwright browsers
        if: matrix.e2e
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: integration-${{ runner.os }}-playwright-${{ matrix.case }}-${{ hashFiles('template/**/package.json.jinja') }}
          restore-keys: integration-${{ runner.os }}-playwright-${{ matrix.case }}-
      - name: Validate generated project
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tauri-cargo
          DOCKER_CACHE_ARGS: ${{ matrix.family == 'fastapi' && '--cache-from type=gha,scope=integration-fastapi --cache-to type=gha,mode=max,scope=integration-fastapi' || '' }}
        run: devbox run "integration:${{ matrix.case }}"
